name: terraform plan

# A pull request shows what it would change and stops there. Nothing here can
# apply: the job never runs `terraform apply`. The role is the same one
# aws-deploy.yml uses, so the plan is a true preview.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          # The wrapper exposes stdout to later steps.
          terraform_wrapper: true

      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      - name: init
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: validate
        run: terraform -chdir=infra/terraform validate

      - name: plan
        id: plan
        # continue-on-error so a failed plan still reaches the PR comment; the
        # last step re-raises it.
        run: terraform -chdir=infra/terraform plan -input=false -no-color -lock=false
        continue-on-error: true

      - name: comment
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const marker = '<!-- terraform-plan -->';
            // The repo is public: mask account ids before posting.
            const raw = (process.env.PLAN || '(no output)').replace(/\b\d{12}\b/g, '<account>');
            const plan = raw.length > 60000 ? '...truncated...\n' + raw.slice(-60000) : raw;
            const body = [
              marker,
              `### Terraform plan: \`${process.env.OUTCOME}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      - name: fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
